name: Highpass
options:
  bundleIdPrefix: com.highpass.player.ios
  deploymentTarget:
    iOS: '17.1'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.3.8'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  HighpassHTTP:
    type: application
    platform: iOS
    sources: [Highpass]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.highpass.player.ios.http
        INFOPLIST_FILE: Highpass/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconHTTP
        HIGHPASS_TRANSPORT: http
        HIGHPASS_DISPLAY_NAME: Highpass HTTP
  HighpassP2P:
    type: application
    platform: iOS
    sources: [Highpass]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.highpass.player.ios.p2p
        INFOPLIST_FILE: Highpass/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconP2P
        HIGHPASS_TRANSPORT: p2p
        HIGHPASS_DISPLAY_NAME: Highpass P2P
  HighpassTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HighpassHTTP
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HighpassHTTP:
    build:
      targets:
        HighpassHTTP: all
    test:
      targets: [HighpassTests]
  HighpassP2P:
    build:
      targets:
        HighpassP2P: all
