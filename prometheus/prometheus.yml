global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
scrape_configs:
  - job_name: fastify_p2p_app
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ['app:3000']
        labels:
          environment: development
          service: p2p-engine
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
