global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
scrape_configs:
  - job_name: fastify_p2p_app
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ['p2p-blue:3000']
        labels: { environment: production, service: p2p-engine, slot: blue }
      - targets: ['p2p-green:3000']
        labels: { environment: production, service: p2p-engine, slot: green }
      - targets: ['p2p-fallback:3000']
        labels: { environment: production, service: p2p-engine, slot: fallback }
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: highpass_host
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: highpass_public_probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://p2p.remoto.api.br/health/ready
          - https://p2p.remoto.api.br/player/
          - https://p2p.remoto.api.br/grafana/api/health
          - http://xuione.remoto.api.br/player_api.php
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
