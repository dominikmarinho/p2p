# Instalado em /etc/nginx/conf.d/highpass.conf (contexto http).
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}
limit_req_zone $binary_remote_addr zone=highpass_auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=highpass_api_limit:10m rate=30r/s;
# $uri omite os tickets presentes na query string.
map $uri $highpass_log_uri {
    ~^/api/iptv/(media|tracker|vod)/ /api/iptv/[redacted];
    default $uri;
}
log_format highpass '$remote_addr [$time_local] "$request_method $highpass_log_uri $server_protocol" $status $body_bytes_sent';
include /etc/nginx/highpass/upstream.conf;
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    access_log off;
    location = /health/ready {
        proxy_pass http://highpass_api;
        add_header X-Highpass-Upstream $upstream_addr always;
        include /etc/nginx/snippets/highpass-proxy.conf;
    }
    location / { return 404; }
}
