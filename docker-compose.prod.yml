x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3000
  LOG_LEVEL: info
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatória com senha percent-encoded}
  ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD obrigatória}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatória}
  TRUST_PROXY_HOPS: 1
  ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:?ADMIN_BOOTSTRAP_KEY obrigatória}
  CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY obrigatória}
  XUI_ALLOWED_HOSTS: ${XUI_ALLOWED_HOSTS:?XUI_ALLOWED_HOSTS obrigatória}
  XUI_ALLOW_HTTP: ${XUI_ALLOW_HTTP:-false}
  METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN obrigatório}
  XUI_BASE_URL: ${XUI_BASE_URL:-http://xuione.remoto.api.br}
  PUBLIC_ENGINE_URL: ${PUBLIC_ENGINE_URL:-https://p2p.remoto.api.br}
  RTC_ICE_SERVERS: ${RTC_ICE_SERVERS:-[{"urls":"stun:stun.l.google.com:19302"}]}
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-highpass_db}
      POSTGRES_USER: ${POSTGRES_USER:-highpass_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD obrigatória}
    command: ["/bin/sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 128mb --maxmemory-policy noeviction --save '' --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    logging: *logging
  migration-runner:
    image: ${APP_IMAGE:?APP_IMAGE obrigatória}
    command: ["node", "dist/db/migrate.js"]
    restart: "no"
    environment: *app-environment
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    logging: *logging
  app:
    image: ${APP_IMAGE:?APP_IMAGE obrigatória}
    restart: unless-stopped
    init: true
    environment: *app-environment
    ports: ["127.0.0.1:${APP_PORT:-3001}:3000"]
    stop_grace_period: 30s
    read_only: true
    tmpfs: ["/tmp:size=256m,noexec,nosuid"]
    volumes: ["vod_cache:/cache/vod"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    cpus: 2.0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migration-runner: { condition: service_completed_successfully }
    networks:
      backend:
        aliases: ["p2p-${APP_SLOT:-blue}"]
    logging: *logging
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN obrigatório}
    entrypoint: [/bin/sh, -c]
    command:
      - 'umask 077; printf "%s" "$$METRICS_TOKEN" > /tmp/metrics-token; exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d --storage.tsdb.retention.size=2GB'
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    logging: *logging
  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    ports: ["127.0.0.1:3003:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD obrigatória}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    mem_limit: 512m
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      prometheus: { condition: service_healthy }
    networks: [backend]
    logging: *logging
networks:
  backend:
    name: highpass-backend
    external: true
volumes:
  vod_cache:
  postgres_data:
    name: highpass_postgres_prod_data
    external: true
  prometheus_data:
    name: highpass_prometheus_data
    external: true
  grafana_data:
    name: highpass_grafana_data
    external: true
